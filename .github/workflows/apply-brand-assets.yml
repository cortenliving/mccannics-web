name: Apply brand assets
on:
  push:
    paths:
      - '_brand_chunks/**'
      - '_site_chunks/**'
      - 'favicon.png.b64'
      - 'scripts/assemble_site.py'
      - '.github/workflows/apply-brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNGs from base64 chunks
        run: |
          set -euo pipefail
          if ls _brand_chunks/logo-mccannics.png.b64.part* >/dev/null 2>&1; then
            cat _brand_chunks/logo-mccannics.png.b64.part* | tr -d '\n' | base64 -d > logo-mccannics.png
            echo "Decoded logo-mccannics.png ($(wc -c < logo-mccannics.png) bytes)"
            file logo-mccannics.png
          fi
          if [ -f favicon.png.b64 ]; then
            base64 -d favicon.png.b64 > favicon.png
            echo "Decoded favicon.png ($(wc -c < favicon.png) bytes)"
            file favicon.png
          fi
      - name: Assemble site files from chunks
        run: python3 scripts/assemble_site.py
      - name: Commit assembled assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo-mccannics.png favicon.png index.html styles.css site.js README.md about/ hire/ shop/ services/ contact/ solar/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Assemble McCannics site pages and brand PNGs"
            git push
          fi
